services:
  postgres:
    image: postgres:16-alpine
    container_name: voicepay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: voicepay
      POSTGRES_USER: voicepay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voicepay_dev_2026}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./init_day7.sql:/docker-entrypoint-initdb.d/02-init-day7.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicepay -d voicepay"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
    driver: local
